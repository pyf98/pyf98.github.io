name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  workflow_dispatch:
    inputs:
      refresh_citations:
        description: Refresh Google Scholar counts before publishing
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.11"
          bundler-cache: true
      - name: Refresh Google Scholar citation counts
        if: >-
          (github.event_name == 'schedule' || inputs.refresh_citations) &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if ! bundle exec ruby bin/update_scholar_citations.rb; then
            echo "::warning::Google Scholar refresh failed. Publishing the saved citation counts."
            exit 0
          fi
          git add -- _data/scholar_citations.yml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh Google Scholar citation counts'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Verify profile images
        run: |
          bundle exec ruby -ryaml -rdate <<'RUBY'
          config = YAML.load_file("_config.yml", permitted_classes: [Date])
          about = YAML.safe_load(File.read("_pages/about.md").split(/^---\s*$/, 3)[1])
          original = File.join("_site/assets/img", about.fetch("profile").fetch("image"))
          images = [original]
          if config.dig("imagemagick", "enabled")
            stem = original.delete_suffix(File.extname(original))
            images.concat(config.fetch("imagemagick").fetch("widths").map { |width| "#{stem}#{width.zero? ? '' : "-#{width}"}.webp" })
          end
          missing = images.reject { |path| File.size?(path) }
          abort "Missing profile images: #{missing.join(', ')}" unless missing.empty?
          puts "Verified #{images.length} profile images."
          RUBY
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
